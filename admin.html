<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Admin Dashboard V4.5</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script defer src="script.js"></script>
</head>
<body class="admin-body">
    <div class="sidebar">
        <div class="brand">
            <h2><i class="fas fa-cube"></i> RBX Admin</h2>
        </div>
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            <span id="displayUsername">Admin</span>
        </div>
        <ul class="nav-links">
            <li><a href="#" onclick="logAction('[SYSTEM] Commencing server wipe...')"><i class="fas fa-skull"></i> Wipe Server</a></li>
            <li><a href="#" onclick="logAction('[SYSTEM] Database backup initiated.')"><i class="fas fa-database"></i> Backup DB</a></li>
        </ul>
        <div class="bottom-nav">
            <select id="languageSelect" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="vi">Tiếng Việt</option>
            </select>
            <button onclick="logout()" class="btn danger-btn w-100"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>

    <div class="content">
        <header>
            <h1 id="dashboardTitle">Dashboard Overview</h1>
            <div class="status-badge"><i class="fas fa-wifi"></i> System Online</div>
        </header>

        <main>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-coins"></i></div>
                    <div class="stat-info">
                        <h3>Server Robux Pool</h3>
                        <p id="serverPoolRobux" style="font-family: monospace; color: #f59e0b;">12,992,349,394,287</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon warning"><i class="fas fa-user-ninja"></i></div>
                    <div class="stat-info">
                        <h3>Target's Robux</h3>
                        <p id="targetRobux" style="font-family: monospace;">---</p>
                    </div>
                </div>
            </div>

            <div class="action-panel">
                <h3>Player Actions</h3>
                <div class="action-controls">
                    <input type="text" id="playerName" placeholder="Enter Target Username...">
                    <button class="btn info-btn" onclick="scanPlayer()"><i class="fas fa-crosshairs"></i> Scan Info</button>
                    <button class="btn danger-btn" onclick="executeCommand('Ban')"><i class="fas fa-gavel"></i> Ban Target</button>
                </div>
                
                <div class="action-controls custom-hack-area" style="margin-top: 15px;">
                    <input type="number" id="customRobuxAmount" placeholder="Nhập số Robux muốn hack..." min="1">
                    <button class="btn success-btn" onclick="executeCommand('Custom Inject')"><i class="fas fa-hand-holding-dollar"></i> Inject Custom R$</button>
                </div>
            </div>

            <div class="log-panel">
                <h3><i class="fas fa-terminal"></i> Terminal Logs</h3>
                <div class="log-container">
                    <ul id="logList">
                        <li>[System] Dashboard initialized. Secure connection established...</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
