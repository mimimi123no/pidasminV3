<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Admin Dashboard V3.5</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script defer src="script.js"></script>
</head>
<body class="admin-body">
    <div class="sidebar">
        <div class="brand">
            <h2><i class="fas fa-cube"></i> RBX Admin</h2>
        </div>
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            <span id="displayUsername">Admin</span>
        </div>
        <ul class="nav-links">
            <li><a href="#" onclick="executeCommand('Ban Player')"><i class="fas fa-ban"></i> Ban Player</a></li>
            <li><a href="#" onclick="executeCommand('Unban Player')"><i class="fas fa-check"></i> Unban Player</a></li>
            <li><a href="#" onclick="executeCommand('Delete Game')"><i class="fas fa-trash"></i> Delete Game</a></li>
            <li><a href="#" onclick="executeCommand('Server Wipe')"><i class="fas fa-skull"></i> Wipe Server</a></li>
        </ul>
        <div class="bottom-nav">
            <select id="languageSelect" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="vi">Tiếng Việt</option>
            </select>
            <button onclick="logout()" class="btn danger-btn w-100"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>

    <div class="content">
        <header>
            <h1 id="dashboardTitle">Dashboard Overview</h1>
            <div class="status-badge"><i class="fas fa-wifi"></i> System Online</div>
        </header>

        <main>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-coins"></i></div>
                    <div class="stat-info">
                        <h3>Sales Robux</h3>
                        <p id="salesRobux">1,250</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon warning"><i class="fas fa-clock"></i></div>
                    <div class="stat-info">
                        <h3>Pending Robux</h3>
                        <p id="pendingRobux">0</p>
                    </div>
                </div>
            </div>

            <div class="action-panel">
                <h3>Quick Actions</h3>
                <div class="action-controls">
                    <input type="text" id="playerName" placeholder="Enter Player Username...">
                    <button class="btn primary-btn" onclick="executeCommand('Ban', document.getElementById('playerName').value)"><i class="fas fa-gavel"></i> Ban</button>
                    <button class="btn success-btn" onclick="executeCommand('Add Robux', document.getElementById('playerName').value)"><i class="fas fa-hand-holding-dollar"></i> Give Robux</button>
                    <button id="fakeAddRobux" class="btn warning-btn"><i class="fas fa-plus-circle"></i> Add 120k to Pool</button>
                </div>
            </div>

            <div class="log-panel">
                <h3><i class="fas fa-terminal"></i> System Logs</h3>
                <div class="log-container">
                    <ul id="logList">
                        <li>[System] Dashboard initialized...</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
